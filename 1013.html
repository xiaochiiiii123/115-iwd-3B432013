<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的個人網站</title>
    <style>
        /* ... 原本的 CSS 都不用動，保留原本的樣子 ... */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html { scroll-behavior: smooth; }

        body {
            font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
            background-color: #f8fafc;
            color: #334155;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #e2e8f0;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(8px);
        }
        header h2 { color: #0f172a; font-size: 20px; letter-spacing: 1px; }
        
        nav { margin-top: 15px; }
        nav a {
            color: #64748b;
            text-decoration: none;
            margin: 0 15px;
            font-size: 16px;
            transition: all 0.2s;
            padding-bottom: 4px;
        }
        nav a:hover { 
            color: #3b82f6; 
            font-weight: bold;
            border-bottom: 2px solid #3b82f6;
        }
        
        main {
            flex-grow: 1;
            display: grid;
            /* 配合新增的 AI 卡片，網格會自動往下排 */
            grid-template-columns: repeat(3, 1fr); 
            gap: 24px;                 
            max-width: 1200px;         
            width: 100%;
            margin: 0 auto;            
            padding: 40px 20px;
            align-items: stretch;      
        }

        .card {
            scroll-margin-top: 100px;
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            width: 100%;
            
            display: flex;
            flex-direction: column;
            justify-content: center;

            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid #f1f5f9;
        }

        .avatar { 
            width: 120px; height: 120px; 
            background-color: #e2e8f0; 
            border-radius: 50%; 
            margin: 0 auto 20px auto; 
            overflow: hidden; 
            border: 3px solid #ffffff; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.08); 
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        
        h1 { color: #0f172a; font-size: 26px; margin-bottom: 8px; font-weight: 700; }
        .subtitle { color: #3b82f6; font-size: 15px; margin-bottom: 24px; font-weight: 600; letter-spacing: 0.5px; }
        p.intro { color: #475569; line-height: 1.7; font-size: 15px; text-align: left; }

        .form-title { color: #0f172a; font-size: 22px; margin-bottom: 24px; text-align: center; font-weight: 700; }
        .form-group { margin-bottom: 18px; text-align: left; position: relative; }
        .form-group label { display: block; margin-bottom: 6px; color: #475569; font-size: 14px; font-weight: 600; }
        
        .form-group input, .form-group textarea { 
            width: 100%; 
            padding: 10px 12px; 
            border-radius: 6px; 
            border: 1px solid #cbd5e1; 
            background-color: #ffffff; 
            color: #0f172a; 
            font-size: 15px; 
            font-family: inherit; 
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-group textarea { resize: vertical; }
        .form-group input:focus, .form-group textarea:focus { 
            outline: none; 
            border-color: #3b82f6; 
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .form-group input.invalid {
            border-color: #ef4444;
        }
        .form-group input.invalid:focus {
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
        }

        .error-msg {
            color: #ef4444;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }
        
        .submit-btn { 
            width: 100%; 
            padding: 12px; 
            margin-top: 8px; 
            border: none; 
            border-radius: 6px; 
            background-color: #3b82f6; 
            color: white; 
            font-size: 16px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: background-color 0.2s; 
        }
        .submit-btn:hover { background-color: #2563eb; }

        .submit-btn:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        footer { background-color: transparent; text-align: center; padding: 20px; font-size: 13px; color: #94a3b8; }

        @media (max-width: 992px) {
            main { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 768px) {
            main { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header>
        <h2>我的個人網站</h2>
        <nav>
            <a href="#home">首頁</a>
            <a href="#about">關於我</a>
            <a href="#contact">聯絡我</a>
            <!-- 【修改 1】選單新增一個 AI 問答的連結 -->
            <a href="#qa">AI 問答</a>
        </nav>
    </header>

    <main>
        <!-- 原本的：首頁卡片 -->
        <div id="home" class="card">
            <h1 style="font-size: 28px; margin-bottom: 15px;">歡迎來到我的專屬空間 👋</h1>
            <p style="color: #64748b; line-height: 1.8; font-size: 16px;">
                這是一個全新的開始！<br>您可以透過上方導覽列快速跳轉，進一步認識我，或是傳送訊息與我聯絡。
            </p>
        </div>

        <!-- 原本的：關於我卡片 -->
        <div id="about" class="card">
            <div class="avatar">
                <img src="avatar.png" alt="個人照" onerror="this.style.display='none'">
            </div>
            <h1>簡映綺</h1>
            <div class="subtitle">資管系</div>
            <p class="intro">
                喵喵喵
            </p>
        </div>

        <!-- 原本的：聯絡我卡片 -->
        <div id="contact" class="card">
            <h2 class="form-title">聯絡我</h2>
            <form action="#" method="POST" id="contactForm">
                <div class="form-group">
                    <label for="userName">姓名：</label>
                    <input type="text" id="userName" name="userName" placeholder="請輸入您的姓名" required>
                </div>
                <div class="form-group">
                    <label for="userEmail">Email：</label>
                    <input type="text" id="userEmail" name="userEmail" placeholder="example@email.com" required>
                    <div id="emailError" class="error-msg">請輸入有效的 Email 格式（例：user@example.com）</div>
                </div>
                <div class="form-group">
                    <label for="userMessage">訊息內容：</label>
                    <textarea id="userMessage" name="userMessage" rows="5" placeholder="有什麼想對我說的嗎？" required></textarea>
                </div>
                <button type="submit" id="submitBtn" class="submit-btn">送出訊息</button>
            </form>
        </div>

        <!-- 【修改 2】新增第四張卡片：AI 問答功能 -->
        <div id="qa" class="card">
            <h2 class="form-title">本地 AI 聊天室</h2>
            <div class="form-group">
                <label for="aiInput">問我任何問題：</label>
                <input type="text" id="aiInput" placeholder="例如：寫程式遇到困難怎麼辦？">
            </div>
            <!-- 按下按鈕時，執行 askAI() 函數 -->
            <button type="button" id="aiBtn" class="submit-btn" onclick="askAI()">送出問題</button>
            
            <!-- 顯示 AI 回答的對話框，加了一點簡單的樣式讓它看起來像對話泡泡 -->
            <div style="margin-top: 20px; text-align: left; background-color: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; min-height: 100px;">
                <strong style="color: #3b82f6; font-size: 14px;">🤖 AI 的回答：</strong>
                <p id="aiResponse" style="margin-top: 8px; color: #475569; font-size: 15px; line-height: 1.6;">(等待發問中...)</p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 簡映綺. All rights reserved.</p>
    </footer>

    <script>
        // === 原本的聯絡表單 JavaScript ===
        const form = document.getElementById('contactForm');
        const submitBtn = document.getElementById('submitBtn');
        const emailInput = document.getElementById('userEmail');
        const emailError = document.getElementById('emailError');

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        emailInput.addEventListener('input', function() {
            const emailValue = emailInput.value.trim();
            if (emailValue === '' || emailRegex.test(emailValue)) {
                emailInput.classList.remove('invalid');
                emailError.style.display = 'none';
            } else {
                emailInput.classList.add('invalid');
                emailError.style.display = 'block';
            }
        });

        form.addEventListener('submit', function(event) {
            event.preventDefault(); 
            const emailValue = emailInput.value.trim();
            if (!emailRegex.test(emailValue)) {
                emailInput.classList.add('invalid');
                emailError.style.display = 'block';
                return; 
            }
            submitBtn.textContent = "已送出";
            submitBtn.disabled = true;
        });

        // === 【修改 3】新增的 LM Studio 串接 JavaScript ===
async function askAI() {
            const aiInput = document.getElementById('aiInput').value;
            const aiResponse = document.getElementById('aiResponse');
            const aiBtn = document.getElementById('aiBtn');
            
            if(aiInput.trim() === "") {
                alert("請先輸入問題再送出喔！");
                return;
            }

            aiResponse.innerText = "AI 思考中，請稍候...";
            aiBtn.textContent = "處理中...";
            aiBtn.disabled = true;

            try {
                // 這是 LM Studio 的 API 網址
                const response = await fetch('http://localhost:1234/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: "local-model", 
                        // ★★★ 就是下面這個 messages 欄位！如果是 Ollama 格式會寫成 prompt ★★★
                        messages: [
                            { role: "system", content: "你是一個繁體中文的助理，請用友善的語氣回答。" },
                            { role: "user", content: aiInput }
                        ],
                        temperature: 0.7, 
                        stream: false
                    })
                });

                const data = await response.json();
                
                // ★★★ 抓取答案的路徑也跟 Ollama 不同 ★★★
                aiResponse.innerText = data.choices[0].message.content;
                
            } catch (error) {
                aiResponse.innerText = "連線失敗！請檢查 LM Studio 的 Local Server 是不是有按 Start Server (Port: 1234)？";
                console.error(error);
            } finally {
                aiBtn.textContent = "送出問題";
                aiBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
