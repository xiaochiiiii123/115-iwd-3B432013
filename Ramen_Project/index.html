<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中山一番拉麵 | 線上菜單</title>
    <style>
        body { font-family: '微軟正黑體', sans-serif; background-color: #f8f9fa; margin: 0; padding: 0; }
        header { background-color: #2c3e50; color: white; text-align: center; padding: 20px 0; }
        .container { max-width: 900px; margin: 20px auto; padding: 0 15px; }
        .menu-grid { display: flex; flex-wrap: wrap; gap: 20px; }
        /* 讓卡片在電腦上是兩排，手機上自動變單排 */
        .menu-card { background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: calc(50% - 10px); padding: 15px; box-sizing: border-box; position: relative; }
        @media (max-width: 600px) { .menu-card { width: 100%; } }
        
        .menu-card img { width: 100%; height: 200px; object-fit: cover; border-radius: 4px; background-color: #eee; }
        .price { color: #e74c3c; font-weight: bold; font-size: 1.2em; margin-bottom: 5px; }
        
        /* 新增：預計製作時間的視覺標籤 */
        .prep-time { font-size: 0.85em; color: #7f8c8d; background-color: #ecf0f1; padding: 4px 8px; border-radius: 4px; display: inline-block; margin-bottom: 10px; }
        
        .btn { display: inline-block; background-color: #e67e22; color: white; padding: 12px 20px; text-decoration: none; border-radius: 4px; text-align: center; margin-top: 30px; width: 100%; box-sizing: border-box; font-weight: bold; font-size: 1.1em;}
        .btn:hover { background-color: #d35400; }
    </style>
</head>
<body>

<header>
    <h1>🍜 一番拉麵</h1>
    <p>堅持每日熬煮，提供最豐富的肉品選擇</p>
</header>

<div class="container">
    <h2>本日供應菜單</h2>
    <div class="menu-grid">
        
        <!-- 卡片 1：豬肉 -->
        <div class="menu-card">
            <img src="https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=500&q=80" alt="濃厚豚骨拉麵">
            <h3>招牌濃厚豚骨拉麵 (豬肉)</h3>
            <div class="prep-time">⏱️ 預計製作：10 分鐘</div>
            <p>經典濃郁湯頭，搭配軟嫩炙烤厚切豬叉燒。</p>
            <p class="price">NT$ 220</p>
        </div>

        <!-- 卡片 2：雞肉 (新增) -->
        <div class="menu-card">
            <img src="https://images.unsplash.com/photo-1557872943-16a5ac26437e?w=500&q=80" alt="舒肥雞白湯拉麵">
            <h3>松露舒肥雞白湯拉麵 (雞肉)</h3>
            <div class="prep-time">⏱️ 預計製作：12 分鐘</div>
            <p>富含膠質的濃郁雞湯，搭配低溫舒肥超嫩雞胸肉。</p>
            <p class="price">NT$ 240</p>
        </div>

        <!-- 卡片 3：牛肉 (新增) -->
        <div class="menu-card">
            <img src="https://images.unsplash.com/photo-1591814468924-caf88d1232e1?w=500&q=80" alt="炙燒雪花牛醬油拉麵">
            <h3>炙燒雪花牛醬油拉麵 (牛肉)</h3>
            <div class="prep-time">⏱️ 預計製作：15 分鐘</div>
            <p>清甜秘製醬油底，鋪滿大火炙燒的香氣雪花牛。</p>
            <p class="price">NT$ 260</p>
        </div>
        
        <!-- 卡片 4：清湯 -->
        <div class="menu-card">
            <img src="https://images.unsplash.com/photo-1623341214825-9f4f963727da?w=500&q=80" alt="柚子鹽味清湯拉麵">
            <h3>柚子鹽味清湯拉麵</h3>
            <div class="prep-time">⏱️ 預計製作：8 分鐘</div>
            <p>清爽無負擔，散發淡淡柚子香氣，素食者亦可食用。</p>
            <p class="price">NT$ 200</p>
        </div>

    </div>

    <a href="checkout.html" class="btn">選好餐點了，前往填寫預訂資料 ➔</a>
</div>

</body>
</html>
